[project]
name = "py-template"
version = "0.1.0"
description = "FastAPI backend template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "redis[hiredis]>=5.0.0",
]

[project.scripts]
dev = "app.main:run"
start = "app.main:run"

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

# Fallback for plain pip: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
