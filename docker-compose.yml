# Optional local Postgres / Redis — app still runs without them.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: py_template
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Template default has no password. For local auth, override command e.g.:
    # command: ["redis-server", "--requirepass", "your_password"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
