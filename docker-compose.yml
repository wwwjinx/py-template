# Optional local Postgres only — app still runs without it.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: py_template
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
